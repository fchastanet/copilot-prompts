---
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, manual]
minimum_pre_commit_version: 4.3.0
fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: |
          (?x)(
            testsData/|
            .*\.snap$
          )
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        exclude: |
          (?x)(
            \.gtpl$
          )
      - id: check-xml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: fix-byte-order-marker
      - id: check-yaml
        exclude: |
          (?x)(
            ^internal/model/testsData/transformModel-error/|
            ^internal/model/testsData/transformModel-ok/BinData-commands-default-definitionFiles-duplicateKey.yaml$
          )
      - id: trailing-whitespace
        exclude: |
          (?x)(
            testsData/
          )
        stages: [pre-commit, pre-push, manual]
      - id: check-added-large-files
      - id: forbid-new-submodules
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: file-contents-sorter
        files: .cspell/.*\.txt
        args: [--ignore-case]
        stages: [pre-commit, pre-push, manual]
      - id: check-json
        # x modifier: extended. Spaces and text after a # in the pattern are ignored
        exclude: |
          (?x)(
            ^.vscode\/.*\.json$
          )

  - repo: https://github.com/executablebooks/mdformat
    # Do this before other tools "fixing" the line endings
    rev: 0.7.22
    hooks:
      - id: mdformat
        name: Format Markdown
        entry: mdformat # Executable to run, with fixed options
        language: python
        types: [markdown]
        args: [--wrap, '120', --number]
        additional_dependencies:
          - mdformat-front-matters
          - mdformat-shfmt
          - mdformat-tables
          - mdformat-config
          - mdformat-web
          - mdformat-gfm
        exclude: |
          (?x)(
            ^prompts/|
            ^instructions/commit-message.instructions.md$|
            AGENTS\.md|
            SKILL\.md
          )

  - repo: https://github.com/jsh9/markdown-heading-numbering
    rev: 0.1.0
    hooks:
      - id: markdown-heading-numbering
        args:
          - --start-from-level=2
          - --initial-numbering=1
        exclude: |
          (?x)(
            ^prompts/|
            ^instructions/commit-message.instructions.md$|
            ^doc/ai/|
            /AGENTS\.md$|
            /SKILL\.md$|
            \.presentation\.md$
          )

  - repo: https://github.com/jsh9/markdown-toc-creator
    rev: 0.1.3
    hooks:
      - id: markdown-toc-creator
        args:
          - --proactive=False
          - --style=github
          - --quiet
          - --add-toc-title=False
          - --add-horizontal-rules=False

  - repo: https://github.com/ComPWA/prettier-pre-commit
    rev: v3.4.2
    hooks:
      - id: prettier
        args: [--cache]
        exclude: |
          (?x)(
            \.md$|
            ^\.vscode/.*\.code-snippets$
          )

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        args: [--disable=MD041, --fix]
        exclude: |
          (?x)(
            ^prompts/|
            ^instructions/commit-message.instructions.md$|
            ^doc/ai/|
            \.presentation\.md$
          )

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      # Specific for presentation markdown files
      - id: markdownlint
        args: ['--disable=MD041,MD025,MD023', --fix]
        exclude: |
          (?x)(
            \.presentation\.md$
          )

  - repo: https://github.com/fchastanet/jumanjihouse-pre-commit-hooks
    rev: 3.0.2
    hooks:
      # Check both committed and uncommitted files for git conflict
      # markers and whitespace errors according to core.whitespace
      # and conflict-marker-size configuration in a git repo.
      - id: git-check
        # x modifier: extended. Spaces and text after a # in the pattern are ignored
        exclude: |
          (?x)(
            /testsData/
          )

  - repo: https://github.com/fchastanet/ai-linter
    rev: 0.3.3
    hooks:
      - id: ai-linter-workspace
        args: [--skills]

  - repo: local
    hooks:
      - id: sync-templates
        name: Sync templates
        entry: templates/sync-templates.sh
        language: script
        stages: [pre-commit, pre-push]
        pass_filenames: false
