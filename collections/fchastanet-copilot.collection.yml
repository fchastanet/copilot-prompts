  - path: prompts/fc-gpt-generate-commit-msg.prompt.md
    kind: prompt
  - path: prompts/fc-claude-generate-commit-msg.prompt.md
    kind: prompt
  - path: prompts/fc-smart.prompt.md
    kind: prompt
  - path: agents/fc-refactor-class.prompt.md
    kind: agent
  - path: skills/fc-commit-message/SKILL.md
    kind: skill
  - path: skills/fc-ask-questions/SKILL.md
    kind: skill
  - path: skills/fc-copy-clipboard/SKILL.md
    kind: skill
  - path: skills/fc-human-interaction/SKILL.md
    kind: skill
display:
