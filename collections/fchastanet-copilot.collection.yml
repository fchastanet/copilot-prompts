id: fchastanet-copilot-typescript
name: Fchastanet Copilot Typescript
description: >-
  Meta prompts that help you discover and generate curated GitHub Copilot chat modes, collections, instructions,
  prompts, and agents focused on TypeScript development.
tags: [github-copilot, discovery, meta, prompt-engineering, agents, react, typescript]
items:
  - path: instructions/commit-message.instructions.md
    kind: instruction
  - path: prompts/boost-prompt.prompt.md
    kind: prompt
  - path: prompts/gpt-generate-commit-msg.prompt.md
    kind: prompt
  - path: prompts/claude-generate-commit-msg.prompt.md
    kind: prompt
  - path: prompts/smart.prompt.md
    kind: prompt
  - path: agents/refactor-class.prompt.md
    kind: agent
  - path: skills/commit-message/SKILL.md
    kind: skill
  - path: skills/copy-clipboard/SKILL.md
    kind: skill
  - path: skills/human-interaction/SKILL.md
    kind: skill
display:
  ordering: alpha # or "manual" to preserve the order above
  show_badge: true # set to true to show collection badge on items
  featured: true
